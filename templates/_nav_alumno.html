<style>

    .navegacion-movil {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: white;
        border-top: 1px solid #ddd;
        box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.10);
        z-index: 1000;
    }

    .navegacion-movil a {
        padding: 10px 3px 8px;
        text-align: center;
        text-decoration: none;
        color: #555;
        font-size: 10px;
        font-weight: bold;
    }

    .navegacion-movil-icono {
        display: block;
        font-size: 21px;
        margin-bottom: 3px;
    }

    .navegacion-movil .activo {
        color: #111;
        background-color: #f2f2f2;
    }

    @media (max-width: 750px) {

        .navegacion-movil {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        body {
            padding-bottom: 70px;
        }

    }

</style>


<nav class="navegacion-movil">

    <a
        href="{{ url_for('panel_alumno') }}"
        {% if nav_activa == 'inicio' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">🏠</span>
        Inicio
    </a>

    <a
        href="{{ url_for('mis_clases') }}"
        {% if nav_activa == 'clases' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">📅</span>
        Clases
    </a>

    <a
        href="{{ url_for('mis_inscripciones') }}"
        {% if nav_activa == 'inscripciones' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">📝</span>
        Inscripciones
    </a>

    <a
        href="{{ url_for('lector_qr') }}"
        {% if nav_activa == 'qr' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">📱</span>
        QR
    </a>

</nav>
