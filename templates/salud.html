<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ficha de salud - Training Point</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .contenedor {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #222;
        }

        .boton {
            width: 100%;
            padding: 14px;

            background-color: #222;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #444;
        }

        .volver {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #222;
            text-decoration: none;
        }

        .nota {
            margin-bottom: 25px;
            padding: 15px;

            background-color: #f2f2f2;
            border-radius: 8px;

            color: #555;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Ficha de salud</h1>

        <p class="subtitulo">
            Completá tu información para realizar actividad física.
        </p>

        <div class="nota">
            Esta información será utilizada por Training Point
            para conocer aspectos importantes relacionados con
            tu actividad física.
        </div>

        <form method="POST">

            <div class="campo">

                <label for="contacto_emergencia">
                    Contacto de emergencia
                </label>

                <input
                    type="text"
                    id="contacto_emergencia"
                    name="contacto_emergencia"
                    value="{{ salud.contacto_emergencia or '' }}"
                >

            </div>


            <div class="campo">

                <label for="telefono_emergencia">
                    Teléfono de emergencia
                </label>

                <input
                    type="tel"
                    id="telefono_emergencia"
                    name="telefono_emergencia"
                    value="{{ salud.telefono_emergencia or '' }}"
                >

            </div>


            <div class="campo">

                <label for="lesiones">
                    Lesiones
                </label>

                <textarea
                    id="lesiones"
                    name="lesiones"
                    placeholder="Indicar lesiones actuales o anteriores">{{ salud.lesiones or '' }}</textarea>

            </div>


            <div class="campo">

                <label for="antecedentes">
                    Antecedentes relevantes
                </label>

                <textarea
                    id="antecedentes"
                    name="antecedentes"
                    placeholder="Información relevante para la práctica de actividad física">{{ salud.antecedentes or '' }}</textarea>

            </div>


            <div class="campo">

                <label for="observaciones">
                    Observaciones
                </label>

                <textarea
                    id="observaciones"
                    name="observaciones"
                    placeholder="Otra información que consideres importante">{{ salud.observaciones or '' }}</textarea>

            </div>


            <button type="submit" class="boton">
                Guardar ficha de salud
            </button>

        </form>


        <a href="{{ url_for('perfil_alumno') }}" class="volver">
            Volver a mi perfil
        </a>

    </div>

</body>

</html>
