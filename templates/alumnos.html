<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alumnos - Training Point Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #222;
            color: white;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Lista de alumnos</h1>

        <table>

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>E-mail</th>
                <th>Fecha de nacimiento</th>
                <th>Acciones</th>
            </tr>

            {% for alumno in alumnos %}

            <tr>
                <td>{{ alumno.id }}</td>
                <td>{{ alumno.nombre }}</td>
                <td>{{ alumno.email }}</td>
                <td>{{ alumno.fecha_nacimiento }}</td>

                <td>
                    <a href="{{ url_for('perfil_alumno_admin', alumno_id=alumno.id) }}">
                        Ver perfil
                    </a>
                </td>
            </tr>

            {% endfor %}

        </table>

        <a href="/" class="volver">
            Volver al inicio
        </a>

    </div>

</body>

</html>
