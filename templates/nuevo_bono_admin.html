<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo bono - {{ alumno.nombre }} - Training Point</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
        }

        .contenedor {
            width: 92%;
            max-width: 700px;
            margin: 40px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .informacion {
            background-color: #f7f7f7;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .boton {
            flex: 1;
            padding: 13px 18px;
            background-color: #222;
            color: white;
            text-decoration: none;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .boton:hover {
            background-color: #444;
        }

        .nota {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        @media (max-width: 600px) {

            .contenedor {
                width: 94%;
                padding: 22px;
                margin: 20px auto;
            }

            .botones {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>➕ Registrar nuevo bono</h1>

    <div class="subtitulo">
        Alumno: <strong>{{ alumno.nombre }}</strong>
    </div>


    <form method="POST">


        <!-- TIPO DE BONO -->

        <div class="campo">

            <label for="tipo_bono">
                🎟️ Tipo de bono
            </label>

            <select
                name="tipo_bono_id"
                id="tipo_bono"
                required
            >

                <option value="">
                    Seleccionar bono
                </option>

                {% for tipo in tipos_bono %}

                    <option
                        value="{{ tipo.id }}"
                        data-creditos="{{ tipo.creditos }}"
                        data-precio="{{ tipo.precio }}"
                        data-duracion="{{ tipo.duracion_dias }}"
                    >
                        {{ tipo.nombre }} — ${{ tipo.precio }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- INFORMACIÓN DEL BONO -->

        <div
            class="informacion"
            id="informacion-bono"
            style="display: none;"
        >

            <div>
                🎟️ Créditos:
                <strong id="creditos"></strong>
            </div>

            <div style="margin-top: 8px;">
                💰 Precio:
                <strong id="precio"></strong>
            </div>

            <div style="margin-top: 8px;">
                📅 Duración:
                <strong id="duracion"></strong>
            </div>

        </div>


        <!-- FECHA DE INICIO -->

        <div class="campo">

            <label for="fecha_inicio">
                📅 Fecha de inicio
            </label>

            <input
                type="date"
                name="fecha_inicio"
                id="fecha_inicio"
                required
            >

        </div>


        <!-- FORMA DE PAGO -->

        <div class="campo">

            <label for="forma_pago">
                💳 Forma de pago
            </label>

            <select
                name="forma_pago"
                id="forma_pago"
                required
            >

                <option value="">
                    Seleccionar forma de pago
                </option>

                <option value="Efectivo">
                    💵 Efectivo
                </option>

                <option value="Mercado Pago">
                    💳 Mercado Pago
                </option>

            </select>

        </div>


        <!-- MERCADO PAGO -->

        <div
            class="informacion"
            id="mercado-pago"
            style="display: none;"
        >

            <strong>💳 Mercado Pago</strong>

            <div style="margin-top: 8px;">
                Alias:
                <strong>damiracing.mp</strong>
            </div>

            <div class="nota">
                El pago se registra como realizado mediante Mercado Pago.
            </div>

        </div>


        <!-- BOTONES -->

        <div class="botones">

            <button
                type="submit"
                class="boton"
            >
                💾 Registrar bono
            </button>

            <a
                href="{{ url_for('bonos_alumno_admin', alumno_id=alumno.id) }}"
                class="boton"
            >
                ⬅️ Cancelar
            </a>

        </div>


    </form>

</div>


<script>

    const tipoBono = document.getElementById("tipo_bono");
    const informacionBono = document.getElementById("informacion-bono");

    const creditos = document.getElementById("creditos");
    const precio = document.getElementById("precio");
    const duracion = document.getElementById("duracion");

    tipoBono.addEventListener("change", function() {

        const opcion = this.options[this.selectedIndex];

        if (!opcion.value) {

            informacionBono.style.display = "none";

            return;

        }

        creditos.textContent = opcion.dataset.creditos;
        precio.textContent = "$" + opcion.dataset.precio;

        if (opcion.dataset.duracion === "0") {

            duracion.textContent = "Clase individual";

        } else {

            duracion.textContent = opcion.dataset.duracion + " días";

        }

        informacionBono.style.display = "block";

    });


    const formaPago = document.getElementById("forma_pago");
    const mercadoPago = document.getElementById("mercado-pago");

    formaPago.addEventListener("change", function() {

        if (this.value === "Mercado Pago") {

            mercadoPago.style.display = "block";

        } else {

            mercadoPago.style.display = "none";

        }

    });

</script>

</body>

</html>
