<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Training Point - Ingreso</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/training_point.css') }}"
    >

    <style>
        body.login-body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #080a0c;
            color: #f5f7f9;

            position: relative;
            overflow-x: hidden;
        }

        body.login-body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(8, 10, 12, 0.65),
                    rgba(8, 10, 12, 0.65)
                ),
                url("{{ url_for('static', filename='img/logo_training_point.png') }}");

            background-repeat: no-repeat;
            background-position: center 80px;
            background-size: min(560px, 60vw);

            pointer-events: none;
            z-index: 0;
        }

        .login {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 390px;

            padding: 34px 30px;

            background: rgba(17, 22, 28, 0.94);

            border: 1px solid rgba(36, 153, 232, 0.35);
            border-radius: 16px;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .marca {
            margin: 0 0 8px;

            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;

            color: #f5f7f9;
        }

        .marca .destacado {
            color: #2499e8;
        }

        .subtitulo {
            margin: 0 0 28px;

            color: #a8b0b8;
            font-size: 14px;
        }

        .error {
            margin: 0 0 18px;
            padding: 11px 12px;

            color: #ff9a9a;
            background: rgba(180, 35, 35, 0.12);

            border: 1px solid rgba(255, 100, 100, 0.30);
            border-radius: 8px;

            font-size: 13px;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 14px;
            margin-bottom: 14px;

            background: #0d1115;
            color: #f5f7f9;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;

            font-size: 15px;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #68727c;
        }

        input:focus {
            border-color: #2499e8;

            box-shadow:
                0 0 0 3px rgba(36, 153, 232, 0.12);
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            padding-right: 50px;
        }

        .mostrar-password {
            position: absolute;
            right: 7px;
            top: 4px;

            width: 40px;
            height: 40px;

            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            color: #a8b0b8;

            border: none;

            font-size: 18px;
            cursor: pointer;
        }

        .mostrar-password:hover {
            background: transparent;
            color: #58b9f5;
        }

        .boton-ingresar {
            width: 100%;

            margin-top: 3px;
            padding: 13px;

            background: #2499e8;
            color: white;

            border: 1px solid #2499e8;
            border-radius: 9px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background-color 0.2s ease,
                transform 0.1s ease;
        }

        .boton-ingresar:hover {
            background: #1688d4;
        }

        .boton-ingresar:active {
            transform: scale(0.99);
        }

        .registro {
            margin-top: 24px;
            padding-top: 20px;

            border-top: 1px solid rgba(255, 255, 255, 0.08);

            color: #a8b0b8;
            font-size: 13px;
        }

        .registro p {
            margin: 0 0 9px;
        }

        .registro a {
            color: #58b9f5;

            font-weight: bold;
            text-decoration: none;
        }

        .registro a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body.login-body {
                padding: 18px;
            }

            body.login-body::before {
                background-position: center 90px;
                background-size: 90vw;
            }

            .login {
                max-width: 360px;
                padding: 30px 22px;
            }

            .marca {
                font-size: 25px;
            }
        }
    </style>
</head>

<body class="login-body">

    <main class="login">

        <h1 class="marca">
            <span class="destacado">T</span>RAINING
            <span class="destacado">P</span>OINT
        </h1>

        <p class="subtitulo">
            Ingresá a tu cuenta
        </p>

        {% if error %}
            <p class="error">
                {{ error }}
            </p>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input
                type="text"
                name="usuario"
                placeholder="Tu usuario"
                autocomplete="username"
                required
            >

            <div class="password-container">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="mostrar-password"
                    onclick="mostrarPassword()"
                    aria-label="Mostrar u ocultar contraseña"
                    title="Mostrar u ocultar contraseña"
                >
                    👁
                </button>

            </div>

            <button
                type="submit"
                class="boton-ingresar"
            >
                Ingresar
            </button>

        </form>

        <div class="registro">

            <p>
                ¿No tenés una cuenta?
            </p>

            <a href="{{ url_for('registro') }}">
                Crear mi cuenta
            </a>

        </div>

    </main>

    <script>
        function mostrarPassword() {
            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>

</html>
