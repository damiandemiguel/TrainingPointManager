<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar alumno - Training Point Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #222;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Agregar alumno</h1>

        <form>

            <label for="nombre">
                Nombre y apellido
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="fecha_nacimiento">
                Fecha de nacimiento
            </label>

            <input
                type="text"
                id="fecha_nacimiento"
                name="fecha_nacimiento"
                placeholder="DD/MM/AAAA"
                required
            >


            <button type="submit">
                Agregar alumno
            </button>

        </form>

        <a href="/" class="volver">
            Volver al inicio
        </a>

    </div>

</body>

</html>
