<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - Training Point</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .contenedor {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #222;
        }

        .boton {
            width: 100%;
            padding: 14px;

            background-color: #222;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #444;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: #222;
            text-decoration: none;
        }

        .nota {
            margin-top: 25px;
            padding: 15px;

            background-color: #f2f2f2;
            border-radius: 8px;

            font-size: 14px;
            color: #555;
        }
    .password-container {
    position: relative;
    width: 100%;
    }

    .password-container input {
        padding-right: 50px;
    }

    .mostrar-password {
        position: absolute;
        right: 10px;
        top: 0;

        width: 40px;
        height: 100%;

        padding: 0;

        background: none;
        color: #666;

        border: none;

        font-size: 20px;
        cursor: pointer;
    }

    .mostrar-password:hover {
        background: none;
        color: #222;
    }    
    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Crear cuenta</h1>

        <p class="subtitulo">
            Registrate en Training Point
        </p>

        {% if error %}

            <p style="color: #c00; text-align: center;">
                {{ error }}
            </p>

        {% endif %}

        <form method="POST">

            <div class="campo">

                <label for="nombre">
                    Nombre y apellido
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ datos.nombre if datos else '' }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ datos.email if datos else '' }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="fecha_nacimiento">
                    Fecha de nacimiento
                </label>

                <input
                    type="date"
                    id="fecha_nacimiento"
                    name="fecha_nacimiento"
                    value="{{ datos.fecha_nacimiento if datos else '' }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    value="{{ datos.telefono if datos else '' }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="direccion">
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    value="{{ datos.direccion if datos else '' }}"
                >

            </div>


            <div class="campo">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    value="{{ datos.usuario if datos else '' }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

                <button
                    type="button"
                    class="mostrar-password"
                    onclick="mostrarPassword('password')"
                    aria-label="Mostrar contraseña"
                >
                    👁
                </button>

            </div>

        </div>


        <div class="campo">

            <label for="confirmar_password">
                Confirmar contraseña
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="confirmar_password"
                    name="confirmar_password"
                    required
                >

                <button
                    type="button"
                    class="mostrar-password"
                    onclick="mostrarPassword('confirmar_password')"
                    aria-label="Mostrar confirmación de contraseña"
                >
                    👁
                </button>

            </div>

        </div>


            <button type="submit" class="boton">
                Crear cuenta
            </button>

        </form>


        <div class="nota">
            En los próximos pasos vas a poder completar tu
            información de salud, agregar una foto de perfil
            y adjuntar tu certificado médico.
        </div>


        <a href="/" class="volver">
            Ya tengo una cuenta
        </a>

    </div>
<script>

function mostrarPassword(id) {

    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }

}

</script>

</body>

</html>
