
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Point - Nueva contraseña</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #080a0c;
            color: #f5f7f9;
        }

        .contenedor {
            width: 100%;
            max-width: 390px;
            padding: 34px 30px;
            box-sizing: border-box;
            background: #11161c;
            border: 1px solid rgba(36, 153, 232, 0.35);
            border-radius: 16px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 25px;
        }

        h1 span {
            color: #2499e8;
        }

        p {
            color: #a8b0b8;
            font-size: 14px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-bottom: 14px;
            background: #0d1115;
            color: #f5f7f9;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2499e8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2499e8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1688d4;
        }

        .mensaje {
            margin: 18px 0;
            padding: 12px;
            border-radius: 9px;
            background: rgba(36, 153, 232, 0.10);
            border: 1px solid rgba(36, 153, 232, 0.35);
            color: #f5f7f9;
        }

        .error {
            color: #ff9a9a;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .volver {
            display: inline-block;
            margin-top: 22px;
            color: #58b9f5;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <h1><span>TRAINING</span> POINT</h1>
        <h2>Nueva contraseña</h2>

        {% if mensaje %}
            <p class="mensaje">{{ mensaje }}</p>
        {% else %}
            <p>
                Ingresá tu nueva contraseña para recuperar
                el acceso a Training Point.
            </p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <input
                    type="password"
                    name="password_nueva"
                    placeholder="Nueva contraseña"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <input
                    type="password"
                    name="confirmar_password"
                    placeholder="Confirmar contraseña"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Guardar nueva contraseña
                </button>
            </form>
        {% endif %}

        <a class="volver" href="{{ url_for('inicio') }}">
            ← Volver al inicio de sesión
        </a>
    </main>
</body>
</html>
