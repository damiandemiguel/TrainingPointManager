
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contraseña | Training Point</title>

    <style>
        :root {
            --fondo: #080a0c;
            --tarjeta: #11161c;
            --celeste: #2499e8;
            --blanco: #f5f7f9;
            --gris: #a8b0b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--fondo);
            color: var(--blanco);
            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            padding: 32px 26px;
            background: var(--tarjeta);
            border: 1px solid rgba(36, 153, 232, 0.3);
            border-radius: 18px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 25px;
            text-align: center;
        }

        .descripcion {
            color: var(--gris);
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #39434e;
            border-radius: 9px;
            background: #080a0c;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--celeste);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: var(--celeste);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            padding: 12px;
            border-radius: 9px;
            background: rgba(220, 53, 69, 0.13);
            color: #ff9aa5;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .salir {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: var(--gris);
            text-decoration: none;
            font-size: 13px;
        }

        .salir:hover {
            color: var(--celeste);
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>Crear nueva contraseña</h1>

        <p class="descripcion">
            Estás utilizando una contraseña provisoria.
            Por seguridad, necesitás establecer una contraseña
            personal antes de continuar.
        </p>

        {% if error %}
            <div class="error" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST"
              action="{{ url_for('cambiar_password_obligatorio') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="password_temporal">
                Contraseña provisoria
            </label>

            <input
                type="password"
                id="password_temporal"
                name="password_temporal"
                autocomplete="current-password"
                required
            >

            <label for="password_nueva">
                Nueva contraseña
            </label>

            <input
                type="password"
                id="password_nueva"
                name="password_nueva"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmar_password">
                Confirmar nueva contraseña
            </label>

            <input
                type="password"
                id="confirmar_password"
                name="confirmar_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Guardar nueva contraseña
            </button>

        </form>

        <a class="salir"
           href="{{ url_for('cerrar_sesion') }}">
            Cerrar sesión
        </a>

    </main>

</body>
</html>
