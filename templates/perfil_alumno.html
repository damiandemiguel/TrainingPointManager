<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil - Training Point</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .dato {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .dato:last-child {
            border-bottom: none;
        }

        .etiqueta {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .volver {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 20px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .volver:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Mi perfil</h1>

        <p class="subtitulo">
            Información personal
        </p>

        <div class="dato">
            <span class="etiqueta">Nombre</span>
            {{ alumno[0] }}
        </div>

        <div class="dato">
            <span class="etiqueta">Email</span>
            {{ alumno[1] }}
        </div>

        <div class="dato">
            <span class="etiqueta">Fecha de nacimiento</span>
            {{ alumno[2] }}
        </div>

        <div class="dato">
            <span class="etiqueta">Teléfono</span>
            {{ alumno[3] }}
        </div>

        <div class="dato">
            <span class="etiqueta">Dirección</span>
            {{ alumno[4] }}
        </div>

        <div class="dato">
            <span class="etiqueta">Certificado médico</span>
            {{ alumno[5] or "No informado" }}
        </div>

        <div class="dato">
            <span class="etiqueta">Estado</span>

            {% if alumno[6] == 1 %}
                Activo
            {% else %}
                Inactivo
            {% endif %}
        </div>

        <a href="/panel" class="volver">
            Volver
        </a>

    </div>

</body>

</html>
