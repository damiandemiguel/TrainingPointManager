<style>

    .navegacion-movil {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: white;
        border-top: 1px solid #ddd;
        box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.10);
        z-index: 1000;
    }

    .navegacion-movil a {
        padding: 10px 4px 8px;
        text-align: center;
        text-decoration: none;
        color: #555;
        font-size: 11px;
        font-weight: bold;
    }

    .navegacion-movil-icono {
        display: block;
        font-size: 21px;
        margin-bottom: 3px;
    }

    .navegacion-movil .activo {
        color: #111;
        background-color: #f2f2f2;
    }

    @media (max-width: 750px) {

        .navegacion-movil {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        body {
            padding-bottom: 70px;
        }

    }

</style>


<nav class="navegacion-movil">

    <a
        href="{{ url_for('panel') }}"
        {% if nav_activa == 'inicio' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">🏠</span>
        Inicio
    </a>

    <a
        href="{{ url_for('gestionar_clases') }}"
        {% if nav_activa == 'clases' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">📅</span>
        Clases
    </a>

    <a
        href="{{ url_for('mostrar_alumnos') }}"
        {% if nav_activa == 'alumnos' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">👥</span>
        Alumnos
    </a>

    <a
        href="{{ url_for('estado_alumnos') }}"
        {% if nav_activa == 'abonos' %}class="activo"{% endif %}
    >
        <span class="navegacion-movil-icono">💳</span>
        Abonos
    </a>

</nav>
