<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar perfil - Training Point</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .contenedor {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;

            background-color: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #222;
        }

        .boton {
            width: 100%;
            padding: 14px;

            background-color: #222;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #444;
        }

        .cancelar {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #222;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Editar perfil</h1>

        <p class="subtitulo">
            Modificá tus datos personales
        </p>

        <form method="POST">

            <div class="campo">

                <label for="nombre">
                    Nombre y apellido
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ alumno.nombre }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ alumno.email }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="fecha_nacimiento">
                    Fecha de nacimiento
                </label>

                <input
                    type="date"
                    id="fecha_nacimiento"
                    name="fecha_nacimiento"
                    value="{{ alumno.fecha_nacimiento }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    value="{{ alumno.telefono }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="direccion">
                    Dirección
                </label>

                <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    value="{{ alumno.direccion }}"
                >

            </div>


            <button type="submit" class="boton">
                Guardar cambios
            </button>

        </form>


        <a href="{{ url_for('perfil_alumno') }}" class="cancelar">
            Cancelar
        </a>

    </div>

</body>

</html>
