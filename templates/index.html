<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Training Point Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 800px;
            margin: 60px auto;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #666;
            margin-bottom: 35px;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .boton {
            display: block;
            padding: 18px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .boton:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>TRAINING POINT MANAGER</h1>

        <p class="subtitulo">
            Sistema de gestión de alumnos
        </p>

        <div class="menu">

            <a href="/agregar" class="boton">
                Agregar alumno
            </a>

            <a href="/alumnos" class="boton">
                Ver alumnos
            </a>

            <a href="#" class="boton">
                Buscar alumno
            </a>

            <a href="#" class="boton">
                Modificar alumno
            </a>

            <a href="#" class="boton">
                Eliminar alumno
            </a>

        </div>

    </div>

</body>
</html>
